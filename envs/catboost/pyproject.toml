[project]
name = "rofe-catboost"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost==1.2.8",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "scipy==1.16.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
constraint-dependencies = [
  "cloudpickle==3.1.2",
  "contourpy==1.4.0",
  "cycler==0.12.1",
  "fonttools==4.67.0",
  "graphviz==0.21",
  "joblib==1.6.0",
  "kiwisolver==1.5.1",
  "matplotlib==3.11.2",
  "narwhals==2.27.1",
  "packaging==26.3",
  "pillow==13.0.0",
  "plotly==7.1.0",
  "pyparsing==3.3.3",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.5",
  "six==1.17.0",
  "threadpoolctl==3.7.0",
  "tzdata==2026.5",
]
