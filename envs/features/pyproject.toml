[project]
name = "rofe-env-features"
version = "0.1.0"
description = "Environment for the SigLIP, ELECTRA and E5 embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==4.57.3",
  "tokenizers==0.22.1",
  "huggingface-hub==0.36.0",
  "safetensors==0.7.0",
  "regex==2026.9.10",
  "numpy==2.3.5",
  "pillow==11.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
