[project]
name = "rofe"
version = "0.1.0"
description = "RoFE: rotated frozen embeddings for prior-data fitted networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "torch==2.14.0",
  "pyyaml==6.0.3",
  "huggingface-hub==1.31.0",
  "xgboost==3.4.1",
  "tabicl @ git+https://github.com/soda-inria/tabicl@0dbff3ec8fc68c123c87af77b0ea8b25cd2d23f3",
]

[project.optional-dependencies]
data = ["pillow==12.3.0", "kagglehub==1.0.2"]
test = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rofe"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"rofe/pfn/tabpfn_predict.py" = ["UP"]
"rofe/baselines/mmpfn_run.py" = ["UP"]
